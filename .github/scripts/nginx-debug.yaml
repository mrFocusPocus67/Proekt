# Тестовый конфиг с ошибками для проверки валидатора
# Содержит типичные проблемы, которые встречаются в реальных проектах

server:
  # Ошибка: привязка ко всем интерфейсам в production окружении
  # Должен быть указан конкретный IP
  host: "0.0.0.0"
  
  # Предупреждение: использование порта 80 без HTTPS
  # Рекомендуется порт 443 с сертификатом
  port: 80
  
  # Ошибка: debug режим включен в production
  # Должен быть false
  debug_mode: true
  
  # Ошибка: отрицательное значение количества воркеров
  # Допустимы только положительные числа
  workers: -1
  
  # Ошибка: невалидное значение для булевого поля
  # Ожидается true/false
  additional_server:
    enabled: maybe
    
  # Ошибка: тип данных port должен быть number
  port: "80"

database:
  # Ошибка: пароль не соответствует политике безопасности
  # Должен содержать спецсимволы, цифры, буквы разного регистра
  password: "123456"
  
  # Предупреждение: отключено шифрование соединения
  # Рекомендуется включить SSL/TLS
  ssl: false
  
  # Ошибка: несоответствие типа данных
  # timeout должен быть числом (секунды)
  timeout: "пять минут"
  
  # Ошибка: отрицательное значение пула соединений
  connection_pool: -5
  
  # Ошибка: неверный хост для production окружения
  host: "localhost"

logging:
  # Предупреждение: избыточное логирование в production
  # Рекомендуется уровень INFO или WARNING
  level: "DEBUG"
  
  # Ошибка: указан несуществующий путь для логов
  path: "/var/log/myapp/non_existent_folder/"
  
  # Ошибка: пустой формат логов
  format: ""

security:
  # Предупреждение: открытый CORS для всех источников
  # Рекомендуется указать конкретные домены
  cors_origin: "*"
  
  # Ошибка: отсутствует ограничение частоты запросов
  # rate_limit: 100  # параметр закомментирован
  
  # Ошибка: пустой токен доступа
  access_token: ""

# Предупреждение: неиспользуемый параметр
# Рекомендуется удалить
obsolete_param: "еще нужен?"

# Предупреждение: конфигурация Redis для сервиса, где Redis не используется
# Рекомендуется удалить
redis:
  host: "redis.local"

# Ошибка: невалидная структура данных
# Ожидается ключ-значение, передан список
this_will_break: 
  - "список"
  - "но"
  - "не"
  - "нужен"
