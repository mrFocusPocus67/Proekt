name: Проверка конфигураций

on:
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
  push:
    branches: [main]
    paths:
      - '**.yaml'
      - '**.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    # Добавляем права на запись комментариев
    permissions:
      pull-requests: write
      issues: write
      contents: read
    
    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v3
    
    - name: Устанавливаем Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Устанавливаем зависимости
      run: |
        pip install pyyaml
    
    - name: Запускаем проверку
      run: |
        python .github/scripts/check-config.py
    
    - name: Комментируем PR (если есть проблемы)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          let comment = '## Результаты проверки конфигов\n\n';
          comment += '❌ **Найдены проблемы!**\n\n';
          comment += 'Пожалуйста, исправьте ошибки перед мержем.';
          comment += '\n\nДетали проверки во вкладке "Checks" выше.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
