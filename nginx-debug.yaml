# Тестовый конфиг с ошибками для проверки валидатора

server:
  # Ошибка: привязка ко всем интерфейсам
  host: "0.0.0.0"
  
  # Предупреждение: порт 80 без HTTPS
  port: 80
  
  # Ошибка: debug режим включен
  debug_mode: true
  
  # Ошибка: отрицательное значение
  workers: -1

database:
  # Ошибка: простой пароль
  password: "123456"
  
  # Предупреждение: SSL отключен
  ssl: false
  
  # Ошибка: строка вместо числа
  timeout: "пять минут"
